<text x="250" y="176" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">university</text>
<text x="250" y="200" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">email</text>
<text x="250" y="238" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="13.5" font-weight="400" fill="#0F0F0F" text-anchor="middle">settings/emails</text>
<line x1="323" y1="164" x2="337" y2="164" stroke="#434445" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="340" y="66" width="140" height="196" rx="12" fill="#BDE8FF" stroke="#0032A0" stroke-width="3"/>
