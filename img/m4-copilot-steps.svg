<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Five steps to get GitHub Copilot as a student</title>
<desc id="d">Step 1 create a GitHub account. Step 2 add and verify your university email. Step 3 apply to GitHub Education as a student. Step 4 activate Copilot Student. Step 5 sign in to GitHub from VS Code.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="328" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="36" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000066" text-anchor="middle">From zero to Copilot in VS Code</text>
<rect x="20" y="66" width="140" height="196" rx="12" fill="#BDE8FF" stroke="#0032A0" stroke-width="3"/>
<circle cx="90" cy="98" r="18" fill="#000066" stroke="#FFFFFF" stroke-width="2.5"/>
