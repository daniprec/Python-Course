<text x="90" y="200" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">account</text>
<text x="90" y="238" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="13.5" font-weight="400" fill="#0F0F0F" text-anchor="middle">github.com</text>
<line x1="163" y1="164" x2="177" y2="164" stroke="#434445" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="180" y="66" width="140" height="196" rx="12" fill="#BDE8FF" stroke="#0032A0" stroke-width="3"/>
<circle cx="250" cy="98" r="18" fill="#000066" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="250" y="104" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
