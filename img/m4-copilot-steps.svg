<text x="570" y="176" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">Copilot</text>
<text x="570" y="200" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">Student</text>
<text x="570" y="238" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="13.5" font-weight="400" fill="#0F0F0F" text-anchor="middle">after approval</text>
<line x1="643" y1="164" x2="657" y2="164" stroke="#434445" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="660" y="66" width="140" height="196" rx="12" fill="#6DC201" stroke="#1F3700" stroke-width="3"/>
<circle cx="730" cy="98" r="18" fill="#000066" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="730" y="104" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="730" y="150" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="middle">Sign in</text>
<text x="730" y="176" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">from</text>
<text x="730" y="200" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="middle">VS Code</text>
<text x="730" y="238" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="13.5" font-weight="400" fill="#0F0F0F" text-anchor="middle">same account</text>
<rect x="20" y="282" width="780" height="34" rx="8" fill="#E6F7FF" stroke="#0032A0" stroke-width="2"/>
<text x="410" y="305" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="16" font-weight="600" fill="#000066" text-anchor="middle">Approval can take a few days. If only paid plans appear, wait and try again.</text>
