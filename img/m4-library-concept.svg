<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">How a Python library works</title>
<desc id="d">Your script imports libraries. The standard library comes with Python. Third-party libraries are downloaded from the internet with pip or conda and then imported in the same way.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="418" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="38" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000066" text-anchor="middle">Where do libraries come from?</text>
<rect x="30" y="70" width="220" height="300" rx="10" fill="#E6F7FF" stroke="#0032A0" stroke-width="3"/>
<text x="140" y="102" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#000066" text-anchor="middle">Your code</text>
<rect x="55" y="120" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#0032A0" stroke-width="2"/>
<text x="140" y="155" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="18" font-weight="600" fill="#0F0F0F" text-anchor="middle">analysis.py</text>
<text x="140" y="215" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="18" font-weight="400" fill="#0F0F0F" text-anchor="middle">import random</text>
<text x="140" y="243" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="18" font-weight="400" fill="#0F0F0F" text-anchor="middle">import numpy as np</text>
<text x="140" y="271" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="18" font-weight="400" fill="#0F0F0F" text-anchor="middle">import typer</text>
<text x="140" y="335" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="16" font-weight="400" fill="#434445" text-anchor="middle">import = “use this library”</text>
<rect x="330" y="70" width="460" height="120" rx="10" fill="#F4F4F4" stroke="#888A8C" stroke-width="3"/>
<text x="350" y="100" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#000066" text-anchor="start">Standard library</text>
<text x="350" y="126" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">Comes with Python. Nothing to install.</text>
<rect x="350" y="142" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="399" y="166" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">random</text>
<rect x="457" y="142" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="506" y="166" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">math</text>
<rect x="564" y="142" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="613" y="166" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">json</text>
<rect x="671" y="142" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="720" y="166" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">os</text>
<rect x="330" y="220" width="460" height="150" rx="10" fill="#BDE8FF" stroke="#0032A0" stroke-width="3"/>
<text x="350" y="250" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#000066" text-anchor="start">Third-party libraries</text>
<text x="350" y="276" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">Installed once, in your environment.</text>
<rect x="350" y="292" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#0032A0" stroke-width="2"/>
<text x="399" y="316" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">numpy</text>
<rect x="457" y="292" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#0032A0" stroke-width="2"/>
<text x="506" y="316" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">pandas</text>
<rect x="564" y="292" width="98" height="34" rx="8" fill="#FFFFFF" stroke="#0032A0" stroke-width="2"/>
<text x="613" y="316" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">typer</text>
<text x="350" y="355" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#000066" text-anchor="start">pip install … / conda install …</text>
<line x1="250" y1="160" x2="328" y2="130" stroke="#000066" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<line x1="250" y1="290" x2="328" y2="300" stroke="#000066" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="290" y="214" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="16" font-weight="600" fill="#434445" text-anchor="middle">import</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
