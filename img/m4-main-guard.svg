<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">What if __name__ == "__main__" does</title>
<desc id="d">Two cases. Running python script_sum.py directly makes the name equal to __main__, so main() runs. Importing script_sum from another file sets the name to script_sum, so main() is skipped and only the functions are loaded.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="468" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="38" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000024" text-anchor="middle">Running a file versus importing it</text>
<rect x="25" y="65" width="370" height="330" rx="10" fill="#efefef" stroke="#1f3700" stroke-width="3"/>
<text x="210" y="98" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#000024" text-anchor="middle">A. Run the file</text>
<rect x="50" y="115" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#1f3700" stroke-width="2"/>
<text x="210" y="144" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="18" font-weight="600" fill="#0F0F0F" text-anchor="middle">$ python script_sum.py</text>
<line x1="210" y1="160" x2="210" y2="196" stroke="#000024" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="50" y="198" width="320" height="70" rx="8" fill="#FFFFFF" stroke="#1f3700" stroke-width="2"/>
<text x="210" y="226" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="middle">__name__ is</text>
<text x="210" y="254" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="20" font-weight="700" fill="#000024" text-anchor="middle">"__main__"</text>
<line x1="210" y1="268" x2="210" y2="304" stroke="#000024" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="50" y="306" width="320" height="70" rx="8" fill="#6DC201" stroke="#1F3700" stroke-width="2"/>
<text x="210" y="335" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#0F0F0F" text-anchor="middle">main() RUNS  ✔</text>
<text x="210" y="360" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="16" font-weight="400" fill="#0F0F0F" text-anchor="middle">The program does its work</text>
<rect x="425" y="65" width="370" height="330" rx="10" fill="#F4F4F4" stroke="#888A8C" stroke-width="3"/>
<text x="610" y="98" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#000024" text-anchor="middle">B. Import it from another file</text>
<rect x="450" y="115" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="610" y="144" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="16" font-weight="600" fill="#0F0F0F" text-anchor="middle">from script_sum import sum_fun</text>
<line x1="610" y1="160" x2="610" y2="196" stroke="#434445" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="450" y="198" width="320" height="70" rx="8" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="610" y="226" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="middle">__name__ is</text>
<text x="610" y="254" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="20" font-weight="700" fill="#000024" text-anchor="middle">"script_sum"</text>
<line x1="610" y1="268" x2="610" y2="304" stroke="#434445" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="450" y="306" width="320" height="70" rx="8" fill="#FFFFFF" stroke="#B80010" stroke-width="3"/>
<text x="610" y="335" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#B80010" text-anchor="middle">main() is SKIPPED  ✘</text>
<text x="610" y="360" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="16" font-weight="400" fill="#0F0F0F" text-anchor="middle">Only the functions are loaded</text>
<text x="410" y="440" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#434445" text-anchor="middle">Same file, two behaviours: this is why every script ends with the main guard.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
