<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">The VS Code window</title>
<desc id="d">A schematic of the VS Code window with five numbered areas: 1 the activity bar on the far left, 2 the Explorer panel with your files, 3 the editor where you write code, 4 the terminal at the bottom, and 5 the status bar where the Python interpreter is shown.</desc>
