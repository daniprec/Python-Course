<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">From a folder of scripts to an installed library</title>
<desc id="d">Left: a project folder containing a package folder with __init__.py, regression.py and error.py, plus setup.py and requirements.txt. The command pip install . installs the package into your environment. After that, any script or notebook using that environment can run from my_first_library.regression import linear_regression.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="468" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="38" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000066" text-anchor="middle">Turning your scripts into a library</text>
<rect x="25" y="65" width="330" height="385" rx="10" fill="#E6F7FF" stroke="#0032A0" stroke-width="3"/>
<text x="45" y="100" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">my_first_library/   ← project</text>
<text x="45" y="134" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">├── setup.py</text>
<text x="45" y="168" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">├── requirements.txt</text>
<text x="45" y="202" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">└── my_first_library/  ← package</text>
<text x="45" y="236" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">    ├── __init__.py</text>
<text x="45" y="270" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">    ├── regression.py</text>
<text x="45" y="304" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">    └── error.py</text>
<rect x="45" y="350" width="290" height="80" rx="10" fill="#FFFFFF" stroke="#0032A0" stroke-width="2"/>
<text x="60" y="378" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">__init__.py makes the folder</text>
<text x="60" y="400" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">a package; setup.py says how</text>
<text x="60" y="422" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">to install it.</text>
<rect x="395" y="65" width="400" height="120" rx="10" fill="#BDE8FF" stroke="#0032A0" stroke-width="3"/>
<text x="595" y="98" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000066" text-anchor="middle">1. Install (once)</text>
<rect x="415" y="115" width="360" height="50" rx="8" fill="#FFFFFF" stroke="#0032A0" stroke-width="2"/>
<text x="595" y="148" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="middle">$ pip install .</text>
<line x1="595" y1="186" x2="595" y2="226" stroke="#000066" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="395" y="228" width="400" height="70" rx="10" fill="#F4F4F4" stroke="#888A8C" stroke-width="3"/>
<text x="595" y="258" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000066" text-anchor="middle">Your environment</text>
<text x="595" y="284" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="middle">numpy · typer · my_first_library</text>
<line x1="595" y1="299" x2="595" y2="339" stroke="#000066" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="395" y="341" width="400" height="109" rx="10" fill="#6DC201" stroke="#1F3700" stroke-width="3"/>
<text x="595" y="372" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="middle">2. Use it anywhere</text>
<text x="595" y="398" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="14" font-weight="400" fill="#0F0F0F" text-anchor="middle">from my_first_library.regression</text>
<text x="595" y="420" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="14" font-weight="400" fill="#0F0F0F" text-anchor="middle">    import linear_regression</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
