<title id="t">Folders, working directory and paths</title>
<desc id="d">A tree of folders: Home contains Documents, Downloads and IE. IE contains ComputerProgramming, which contains hello.py, data.csv and a data folder with weather.json. The folder ComputerProgramming is the working directory, so data.csv is a relative path and the full path from the root is an absolute path.</desc>
