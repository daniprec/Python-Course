<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Python data and JSON files</title>
<desc id="d">A Python dictionary in memory is written to a file named file.json with json.dump, and read back into a dictionary with json.load.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="378" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="38" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000024" text-anchor="middle">json.dump writes, json.load reads</text>
<rect x="25" y="70" width="300" height="250" rx="10" fill="#efefef" stroke="#1f3700" stroke-width="3"/>
<text x="175" y="102" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000024" text-anchor="middle">In Python (memory)</text>
<text x="45" y="140" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">data = {</text>
<text x="45" y="170" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">  "name": "Alice",</text>
<text x="45" y="200" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">  "age": 30,</text>
<text x="45" y="230" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">  "skills": ["SQL"]</text>
<text x="45" y="260" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">}</text>
<rect x="495" y="70" width="300" height="250" rx="10" fill="#F4F4F4" stroke="#888A8C" stroke-width="3"/>
<text x="645" y="102" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000024" text-anchor="middle">On disk: file.json</text>
<text x="515" y="140" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">{</text>
<text x="515" y="170" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">  "name": "Alice",</text>
<text x="515" y="200" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">  "age": 30,</text>
<text x="515" y="230" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">  "skills": ["SQL"]</text>
<text x="515" y="260" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="start">}</text>
<line x1="330" y1="170" x2="490" y2="170" stroke="#000024" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="335" y="128" width="150" height="34" rx="8" fill="#d8ffa5" stroke="#1f3700" stroke-width="2"/>
<text x="410" y="151" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="700" fill="#000024" text-anchor="middle">json.dump</text>
<line x1="490" y1="235" x2="330" y2="235" stroke="#000024" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="335" y="243" width="150" height="34" rx="8" fill="#d8ffa5" stroke="#1f3700" stroke-width="2"/>
<text x="410" y="266" font-family='"JetBrains Mono", Consolas, "Courier New", monospace' font-size="17" font-weight="700" fill="#000024" text-anchor="middle">json.load</text>
<text x="410" y="350" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="16" font-weight="600" fill="#434445" text-anchor="middle">dict → object   ·   list → array   ·   str → string   ·   int/float → number</text>
