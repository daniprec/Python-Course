<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Latitude and longitude</title>
<desc id="d">A globe. The equator is the horizontal circle at 0 degrees latitude. The dashed vertical line is the prime meridian through Greenwich, at 0 degrees longitude. A point P is described by its latitude, the angle north or south of the equator, and its longitude, the angle east or west of the prime meridian.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="488" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="38" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000066" text-anchor="middle">Where is a place on the Earth?</text>
<circle cx="300" cy="270" r="170" fill="#BDE8FF" stroke="#0032A0" stroke-width="3"/>
<ellipse cx="300" cy="270" rx="51.0" ry="170" fill="none" stroke="#0032A0" stroke-width="2.5" stroke-dasharray="7 6"/>
<ellipse cx="300" cy="270" rx="170" ry="51.0" fill="none" stroke="#000066" stroke-width="4"/>
<ellipse cx="300" cy="152" rx="118" ry="35" fill="none" stroke="#888A8C" stroke-width="2" stroke-dasharray="3 5"/>
<line x1="300" y1="270" x2="377" y2="179" stroke="#434445" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<path d="M 380 270 A 80 80 0 0 0 351.4230087749231 208.71644455048175" stroke="#000066" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="392" y="244" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="24" font-weight="700" fill="#000066" text-anchor="start">φ</text>
<circle cx="377" cy="179" r="8" fill="#B80010" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="391" y="171" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="20" font-weight="700" fill="#B80010" text-anchor="start">P</text>
<text x="300" y="86" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#0F0F0F" text-anchor="middle">N</text>
<text x="300" y="470" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#0F0F0F" text-anchor="middle">S</text>
<text x="116" y="276" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#0F0F0F" text-anchor="end">W</text>
<text x="484" y="276" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#0F0F0F" text-anchor="start">E</text>
<rect x="520" y="92" width="275" height="126" rx="10" fill="#E6F7FF" stroke="#0032A0" stroke-width="2"/>
<text x="535" y="120" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#000066" text-anchor="start">Latitude  φ</text>
<text x="535" y="146" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">Angle north or south of</text>
<text x="535" y="168" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">the Equator: from −90° to 90°</text>
<text x="535" y="190" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">(Madrid: about 40° N)</text>
<rect x="520" y="236" width="275" height="126" rx="10" fill="#E6F7FF" stroke="#0032A0" stroke-width="2"/>
<text x="535" y="264" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#000066" text-anchor="start">Longitude  λ</text>
<text x="535" y="290" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">Angle east or west of the</text>
<text x="535" y="312" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">Greenwich meridian: −180° to</text>
<text x="535" y="334" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="400" fill="#0F0F0F" text-anchor="start">180° (Madrid: about 4° W)</text>
<rect x="520" y="378" width="275" height="78" rx="10" fill="#FFFFFF" stroke="#888A8C" stroke-width="2"/>
<text x="535" y="404" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="600" fill="#000066" text-anchor="start">Thick circle = Equator (0°)</text>
<text x="535" y="428" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="600" fill="#0032A0" text-anchor="start">Dashed line = Greenwich</text>
<text x="535" y="448" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="600" fill="#0032A0" text-anchor="start">meridian (0°)</text>
