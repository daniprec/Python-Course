<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Conda environments keep projects separate</title>
<desc id="d">One computer with three conda environments. base is the default. demo_env has Python 3.12 and NumPy 1.26. cp_env has Python 3.12 and NumPy 2. Each project uses its own environment, so versions never clash. The command conda activate chooses which one is active.</desc>
