<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Measuring spin along an axis</title>
<desc id="d">A spin-1 particle enters a measuring device that measures the spin along the z axis. The device splits the beam into three possible outcomes, minus h-bar, zero and plus h-bar. In units of h-bar the outcomes are minus 1, 0 and plus 1.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#434445"/></marker></defs>
<rect x="1" y="1" width="818" height="428" rx="14" fill="#FFFFFF" stroke="#BFC1C3" stroke-width="2"/>
<text x="410" y="38" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#000066" text-anchor="middle">One measurement, three possible outcomes</text>
<circle cx="70" cy="215" r="16" fill="#000066" stroke="#FFFFFF" stroke-width="2"/>
<text x="70" y="262" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="600" fill="#434445" text-anchor="middle">particle</text>
<text x="70" y="282" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="600" fill="#434445" text-anchor="middle">with spin 1</text>
<line x1="90" y1="215" x2="200" y2="215" stroke="#434445" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="205" y="150" width="150" height="130" rx="12" fill="#0032A0" stroke="#000066" stroke-width="3"/>
<text x="280" y="196" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Measure</text>
<text x="280" y="222" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
<text x="292" y="228" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">z</text>
<text x="280" y="256" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">(z axis)</text>
<path d="M 358 215 C 440 215, 450 105, 540 105" stroke="#000066" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="548" y="78" width="235" height="54" rx="10" fill="#BDE8FF" stroke="#0032A0" stroke-width="2"/>
<text x="568" y="112" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000066" text-anchor="start">outcome +1</text>
<text x="768" y="112" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="end">(+ħ)</text>
<path d="M 358 215 C 440 215, 450 215, 540 215" stroke="#000066" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="548" y="188" width="235" height="54" rx="10" fill="#BDE8FF" stroke="#0032A0" stroke-width="2"/>
<text x="568" y="222" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000066" text-anchor="start">outcome 0</text>
<text x="768" y="222" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="end">(0)</text>
<path d="M 358 215 C 440 215, 450 325, 540 325" stroke="#000066" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="548" y="298" width="235" height="54" rx="10" fill="#BDE8FF" stroke="#0032A0" stroke-width="2"/>
<text x="568" y="332" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="19" font-weight="700" fill="#000066" text-anchor="start">outcome −1</text>
<text x="768" y="332" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="600" fill="#0F0F0F" text-anchor="end">(−ħ)</text>
<text x="410" y="380" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="middle">Each measurement gives ONE of the three values. Repeating many times</text>
<text x="410" y="404" font-family='Montserrat, Arial, Helvetica, sans-serif' font-size="17" font-weight="400" fill="#0F0F0F" text-anchor="middle">on identical particles tells us how often each outcome appears.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
