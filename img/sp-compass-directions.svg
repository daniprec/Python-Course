<title id="t">The eight compass directions and their bearing</title>
<desc id="d">A compass with eight directions. North is at the top and 0 degrees. North-East is 45 degrees, East 90, South-East 135, South 180, South-West 225, West 270 and North-West 315 degrees, measured clockwise from north.</desc>
