<button type="button" class="ie-theme-toggle" id="ie-theme-toggle">
  <svg class="ie-theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="ie-theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<script>
/* Light/dark switch in the top-right corner (moon in light mode, sun in dark mode).
   It drives Quarto's own toggle, so the choice is remembered across pages and
   shared with the interactive pages (they read the same "quarto-color-scheme" key). */
(function () {
  var btn = document.getElementById("ie-theme-toggle");
  if (!btn) return;
  function sync() {
    var dark = document.body.classList.contains("quarto-dark");
    var label = dark ? "Switch to light mode" : "Switch to dark mode";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  }
  btn.addEventListener("click", function () {
    if (window.quartoToggleColorScheme) window.quartoToggleColorScheme();
    sync();
  });
  new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  sync();
})();
</script>
