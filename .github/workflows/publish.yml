name: Publish Quarto website

on:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "*.qmd"
      - "exams.md"
      - "modules/**"
      - "img/**"
      - "theme/**"
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JUPYTERCACHE: ${{ github.workspace }}/.jupyter_cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bind Quarto to the configured Python
        run: echo "QUARTO_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify the Quarto Python environment
        run: |
          python -c "import sys, numpy; print(f'Python: {sys.executable}'); print(f'NumPy: {numpy.__version__}')"
          quarto check jupyter

      - name: Restore Quarto execution cache
        id: quarto-cache
        uses: actions/cache/restore@v4
        with:
          path: .jupyter_cache
          key: quarto-jupyter-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'data/**', 'scripts/**/*.py') }}-${{ github.sha }}
          restore-keys: |
            quarto-jupyter-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'data/**', 'scripts/**/*.py') }}-

      - name: Render Quarto website
        id: render
        shell: bash
        run: |
          set -o pipefail
          quarto render 2>&1 | tee quarto-render.log

      - name: Report render failure
        if: failure() && steps.render.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/report_quarto_failure.py quarto-render.log

      - name: Save Quarto execution cache
        if: always() && steps.quarto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .jupyter_cache
          key: quarto-jupyter-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'data/**', 'scripts/**/*.py') }}-${{ github.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
